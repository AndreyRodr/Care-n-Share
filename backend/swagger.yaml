openapi: 3.0.0
info:
  title: API Módulo ONG - Sistema de Doações
  description: Documentação das rotas de Dashboard, Gerenciamento de Doações, Projetos/Metas e Controle de Estoque para ONGs.
  version: 1.0.0
servers:
  - url: http://localhost:3000
    description: Servidor de Desenvolvimento

security:
  - bearerAuth: []

paths:
  # ==========================================
  # DASHBOARD DA ONG
  # ==========================================
  /api/ong/dashboard/summary:
    get:
      summary: Resumo geral dos cards do Dashboard
      tags:
        - Dashboard
      responses:
        '200':
          description: Dados resumidos retornados com sucesso.
          content:
            application/json:
              example:
                totalDonations: 128
                pendingDonations: 12
                completedDonations: 116
                activeGoals: 5
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/ong/dashboard/donations:
    get:
      summary: Estatísticas de doações para gráficos
      tags:
        - Dashboard
      responses:
        '200':
          description: Métricas de doações agregadas por mês.
          content:
            application/json:
              example:
                total: 128
                completed: 116
                pending: 12
                byMonth:
                  - month: "Jan"
                    count: 15
                  - month: "Fev"
                    count: 21

  /api/ong/dashboard/goals:
    get:
      summary: Progresso das metas e projetos
      tags:
        - Dashboard
      responses:
        '200':
          description: Lista de metas com o percentual de conclusão.
          content:
            application/json:
              example:
                - id: "uuid-proj-1"
                  title: "Arrecadação de alimentos"
                  current: 75
                  target: 100
                  percentage: 75

  /api/ong/dashboard/volunteers:
    get:
      summary: Estatísticas de voluntariado e apoiadores
      tags:
        - Dashboard
      responses:
        '200':
          description: Dados de voluntários acumulados.
          content:
            application/json:
              example:
                totalVolunteers: 32
                totalHours: 184
                hoursByMonth:
                  - month: "Jan"
                    hours: 20

  /api/ong/dashboard/activity:
    get:
      summary: Lista de atividades recentes da ONG
      tags:
        - Dashboard
      responses:
        '200':
          description: Histórico das últimas atividades.
          content:
            application/json:
              example:
                - id: "uuid-donation-1"
                  type: "DONATION_COMPLETED"
                  description: "Maria Silva realizou uma doação"
                  createdAt: "2026-09-01T14:30:00.000Z"

  # ==========================================
  # GERENCIAMENTO DE DOAÇÕES
  # ==========================================
  /api/ong/donations:
    get:
      summary: Listar doações recebidas com suporte a filtros
      tags:
        - Doações
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Busca por nome do doador ou item
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDENTE, CONCLUIDA, CANCELADO, PENDING, CHECKED_IN, CANCELLED]
          description: Filtrar por status da doação
        - in: query
          name: contributionType
          schema:
            type: string
            enum: [CREDIT, DEBIT, MONEY, PIX]
          description: Filtrar por tipo de transação
      responses:
        '200':
          description: Lista de doações encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Donation'

    post:
      summary: Registrar uma nova intenção/check-in de doação
      tags:
        - Doações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationInput'
      responses:
        '201':
          description: Doação criada com sucesso.

  /api/ong/donations/{id}:
    get:
      summary: Obter detalhes de uma doação específica
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Detalhes da doação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Atualizar informações de uma doação
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationInput'
      responses:
        '200':
          description: Doação atualizada com sucesso.

    delete:
      summary: Remover um registro de doação
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Doação deletada com sucesso.

  /api/ong/donations/{id}/complete:
    patch:
      summary: Confirmar o recebimento físico da doação
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Doação confirmada e estoque atualizado.
          content:
            application/json:
              example:
                id: "uuid-123"
                status: "CHECKED_IN"
                completedAt: "2026-09-02T09:30:00.000Z"
        '400':
          description: Doação não está pendente.

  /api/ong/donations/{id}/cancel:
    patch:
      summary: Cancelar uma doação
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Itens incompatíveis com a necessidade"
      responses:
        '200':
          description: Doação cancelada.

  # ==========================================
  # GERENCIAMENTO DE PROJETOS / METAS
  # ==========================================
  /api/ong/projects:
    get:
      summary: Listar todos os projetos/metas da ONG
      tags:
        - Projetos
      responses:
        '200':
          description: Lista de projetos ativos e concluídos.

    post:
      summary: Criar um novo projeto ou meta
      tags:
        - Projetos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Projeto criado com sucesso.

  /api/ong/projects/{id}:
    get:
      summary: Detalhes do projeto
      tags:
        - Projetos
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Dados do projeto.

    put:
      summary: Atualizar um projeto existente
      tags:
        - Projetos
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Projeto atualizado.

    delete:
      summary: Deletar um projeto
      tags:
        - Projetos
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Projeto removido.

  # ==========================================
  # CONTROLE DE ESTOQUE
  # ==========================================
  /api/ong/inventory:
    get:
      summary: Listar itens em estoque da ONG
      tags:
        - Estoque
      responses:
        '200':
          description: Inventário retornado.

    post:
      summary: Adicionar manualmente um item ao estoque
      tags:
        - Estoque
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryInput'
      responses:
        '201':
          description: Item adicionado ao estoque.

  /api/ong/inventory/{id}:
    get:
      summary: Buscar item do estoque por ID
      tags:
        - Estoque
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Item localizado.

    put:
      summary: Atualizar quantidades ou dados do item no estoque
      tags:
        - Estoque
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryInput'
      responses:
        '200':
          description: Estoque atualizado.

    delete:
      summary: Excluir item do estoque
      tags:
        - Estoque
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Item deletado do inventário.

# ==========================================
# COMPONENTES E SCHEMAS
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID único do recurso (UUID)

  responses:
    Unauthorized:
      description: Token Ausente ou Inválido / Sem permissão de ONG.
      content:
        application/json:
          example:
            error: "Acesso não autorizado."
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          example:
            error: "Recurso não encontrado."

  schemas:
    DonationInput:
      type: object
      required:
        - itemName
        - category
        - quantity
        - unit
        - type
        - donorId
      properties:
        itemName:
          type: string
          example: "Arroz Integral"
        category:
          type: string
          example: "Alimentos"
        quantity:
          type: number
          example: 15
        unit:
          type: string
          example: "KG"
        type:
          type: string
          enum: [CREDIT, DEBIT, MONEY, PIX]
          example: "PIX"
        donorId:
          type: string
          example: "uuid-do-usuario-doador"
        projectId:
          type: string
          example: "uuid-do-projeto-opcional"

    Donation:
      type: object
      properties:
        id:
          type: string
        donor:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        goal:
          type: object
          nullable: true
          properties:
            id:
              type: string
            title:
              type: string
        contributionType:
          type: string
        itemName:
          type: string
        quantity:
          type: number
        status:
          type: string
          enum: [PENDING, CHECKED_IN, CANCELLED]
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          example: "Reforma da Cozinha Comunitária"
        description:
          type: string
          example: "Arrecadação de materiais de construção para reforma"
        causeIds:
          type: array
          items:
            type: string
          example: ["uuid-causa-1", "uuid-causa-2"]

    InventoryInput:
      type: object
      required:
        - itemName
        - category
        - unit
        - quantity
      properties:
        itemName:
          type: string
          example: "Feijão Preto"
        category:
          type: string
          example: "Alimentos"
        unit:
          type: string
          example: "KG"
        quantity:
          type: number
          example: 50.5
        minimumQuantity:
          type: number
          example: 10