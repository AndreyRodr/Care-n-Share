openapi: 3.0.0
info:
  title: API Módulo ONG - Sistema de Doações
  description: Documentação das rotas de Dashboard, Gerenciamento de Doações, Projetos/Metas e Controle de Estoque para ONGs.
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Servidor de Desenvolvimento

security:
  - bearerAuth: []

paths:
  # ==========================================
  # DASHBOARD DA ONG
  # ==========================================
  /api/ong/dashboard/summary:
    get:
      summary: Resumo geral dos cards do Dashboard
      tags:
        - Dashboard
      responses:
        '200':
          description: Dados resumidos retornados com sucesso.
          content:
            application/json:
              example:
                totalDonations: 128
                pendingDonations: 12
                completedDonations: 116
                activeGoals: 5
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/ong/dashboard/donations:
    get:
      summary: Estatísticas de doações para gráficos
      tags:
        - Dashboard
      responses:
        '200':
          description: Métricas de doações agregadas por mês.
          content:
            application/json:
              example:
                total: 128
                completed: 116
                pending: 12
                byMonth:
                  - month: "Jan"
                    count: 15
                  - month: "Fev"
                    count: 21

  /api/ong/dashboard/goals:
    get:
      summary: Progresso das metas e projetos
      tags:
        - Dashboard
      responses:
        '200':
          description: Lista de metas com o percentual de conclusão.
          content:
            application/json:
              example:
                - id: "uuid-proj-1"
                  title: "Arrecadação de alimentos"
                  current: 75
                  target: 100
                  percentage: 75

  /api/ong/dashboard/volunteers:
    get:
      summary: Estatísticas de voluntariado e apoiadores
      tags:
        - Dashboard
      responses:
        '200':
          description: Dados de voluntários acumulados.
          content:
            application/json:
              example:
                totalVolunteers: 32
                totalHours: 184
                hoursByMonth:
                  - month: "Jan"
                    hours: 20

  /api/ong/dashboard/activity:
    get:
      summary: Lista de atividades recentes da ONG
      tags:
        - Dashboard
      responses:
        '200':
          description: Histórico das últimas atividades.
          content:
            application/json:
              example:
                - id: "uuid-donation-1"
                  type: "DONATION_COMPLETED"
                  description: "Maria Silva realizou uma doação"
                  createdAt: "2026-09-01T14:30:00.000Z"

  # ==========================================
  # GERENCIAMENTO DE DOAÇÕES
  # ==========================================
  /api/ong/donations:
    get:
      summary: Listar doações recebidas com suporte a filtros
      tags:
        - Doações
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Busca por nome do doador ou item
        - in: query
          name: status
          schema:
            type: string
            enum: [PENDENTE, CONCLUIDA, CANCELADO, PENDING, CHECKED_IN, CANCELLED]
          description: Filtrar por status da doação
        - in: query
          name: contributionType
          schema:
            type: string
            enum: [CREDIT, DEBIT, MONEY, PIX]
          description: Filtrar por tipo de transação
      responses:
        '200':
          description: Lista de doações encontradas.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Donation'

    post:
      summary: Registrar uma nova intenção/check-in de doação
      tags:
        - Doações
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationInput'
      responses:
        '201':
          description: Doação criada com sucesso.

  /api/ong/donations/{id}:
    get:
      summary: Obter detalhes de uma doação específica
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Detalhes da doação.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Donation'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      summary: Atualizar informações de uma doação
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DonationInput'
      responses:
        '200':
          description: Doação atualizada com sucesso.

    delete:
      summary: Remover um registro de doação
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Doação deletada com sucesso.

  /api/ong/donations/{id}/complete:
    patch:
      summary: Confirmar o recebimento físico da doação
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Doação confirmada e estoque atualizado.
          content:
            application/json:
              example:
                id: "uuid-123"
                status: "CHECKED_IN"
                completedAt: "2026-09-02T09:30:00.000Z"
        '400':
          description: Doação não está pendente.

  /api/ong/donations/{id}/cancel:
    patch:
      summary: Cancelar uma doação
      tags:
        - Doações
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  example: "Itens incompatíveis com a necessidade"
      responses:
        '200':
          description: Doação cancelada.

  # ==========================================
  # GERENCIAMENTO DE PROJETOS / METAS
  # ==========================================
  /api/projects:
    get:
      summary: Listar todos os projetos/metas da ONG
      tags:
        - Projetos
      responses:
        '200':
          description: Lista de projetos ativos e concluídos.

    post:
      summary: Criar um novo projeto ou meta
      tags:
        - Projetos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Projeto criado com sucesso.

  /api/projects/{id}:
    get:
      summary: Detalhes do projeto
      tags:
        - Projetos
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Dados do projeto.

    put:
      summary: Atualizar um projeto existente
      tags:
        - Projetos
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '200':
          description: Projeto atualizado.

    delete:
      summary: Deletar um projeto
      tags:
        - Projetos
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Projeto removido.

  # ==========================================
  # CONTROLE DE ESTOQUE
  # ==========================================
  /api/ong/inventory:
    get:
      summary: Listar itens do inventário da ONG
      tags:
        - Inventário
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema:
            type: string
          description: Busca pelo nome do item (itemName)
        - in: query
          name: category
          schema:
            type: string
          description: Filtra por categoria
        - in: query
          name: status
          schema:
            type: string
            enum: [NORMAL, ESTOQUE_BAIXO, SEM_ESTOQUE]
          description: Filtra pelo status calculado do estoque
      responses:
        '200':
          description: Lista de itens do estoque.
          content:
            application/json:
              example:
                items:
                  - id: "uuid-item-1"
                    itemName: "Ração para cães"
                    category: "ALIMENTAÇÃO"
                    unit: "kg"
                    quantity: 80
                    minimumQuantity: 20
                    status: "NORMAL"

    post:
      summary: Cadastrar item no inventário
      tags:
        - Inventário
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemName
                - category
                - unit
              properties:
                itemName:
                  type: string
                  example: "Ração para cães"
                category:
                  type: string
                  example: "ALIMENTAÇÃO"
                unit:
                  type: string
                  example: "kg"
                quantity:
                  type: number
                  example: 50
                minimumQuantity:
                  type: number
                  example: 20
      responses:
        '201':
          description: Item cadastrado.

  /api/ong/inventory/{id}:
    get:
      summary: Detalhes do item com histórico recente de movimentações
      tags:
        - Inventário
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Dados do item.
        '404':
          description: Item não encontrado.

    patch:
      summary: Atualizar dados cadastrais do item
      tags:
        - Inventário
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                itemName:
                  type: string
                category:
                  type: string
                unit:
                  type: string
                minimumQuantity:
                  type: number
      responses:
        '200':
          description: Item atualizado com sucesso.

    delete:
      summary: Remover item do inventário
      tags:
        - Inventário
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '204':
          description: Item removido.

  /api/ong/inventory/{id}/movements:
    get:
      summary: Listar histórico de movimentações do item
      tags:
        - Movimentações de Estoque
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
        - in: query
          name: type
          schema:
            type: string
            enum: [ENTRADA, SAIDA]
        - in: query
          name: startDate
          schema:
            type: string
            format: date
        - in: query
          name: endDate
          schema:
            type: string
            format: date
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Histórico retornado com paginação.

    post:
      summary: Registrar entrada ou saída de estoque
      tags:
        - Movimentações de Estoque
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - quantity
                - reason
              properties:
                type:
                  type: string
                  enum: [ENTRADA, SAIDA]
                  example: "ENTRADA"
                quantity:
                  type: number
                  example: 10
                reason:
                  type: string
                  example: "Doação recebida #42"
      responses:
        '201':
          description: Movimentação criada e estoque atualizado.
        '400':
          description: Quantidade menor ou igual a zero / Dados inválidos.
        '409':
          description: Conflito - Estoque insuficiente para saída.
          
  # ==========================================
  # USUARIOS
  # ==========================================
  /api/users/register:
    post:
      summary: Cadastrar novo usuário ou ONG
      tags:
        - Usuários & Autenticação
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - type
              properties:
                name:
                  type: string
                  example: "Maria Silva"
                email:
                  type: string
                  format: email
                  example: "maria@email.com"
                password:
                  type: string
                  format: password
                  example: "senha123"
                type:
                  type: string
                  enum: ["U", "O"]
                  description: "'U' para Usuário/Doador, 'O' para ONG"
                  example: "U"
                description:
                  type: string
                  example: "Doadora frequente de itens de vestuário e alimentos."
                pixKey:
                  type: string
                  example: "123.456.789-00"
                profilePicture:
                  type: string
                  format: binary
                  description: Imagem de perfil (upload para Cloudinary)
      responses:
        '201':
          description: Usuário cadastrado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Erro na validação ou e-mail já cadastrado.

  /api/users/login:
    post:
      summary: Autenticar usuário
      tags:
        - Usuários & Autenticação
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                  example: "maria@email.com"
                password:
                  type: string
                  format: password
                  example: "senha123"
      responses:
        '200':
          description: Autenticado com sucesso. Retorna o token JWT e os dados do usuário.
          content:
            application/json:
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  id: "uuid-user-123"
                  name: "Maria Silva"
                  email: "maria@email.com"
                  type: "U"
        '401':
          description: Credenciais inválidas.

  /api/users/ongs:
    get:
      summary: Listar todas as ONGs cadastradas
      tags:
        - Usuários & Autenticação
      responses:
        '200':
          description: Lista de ONGs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserProfile'
        '500':
          description: Erro interno no servidor.

  /api/users/users/{id}:
    get:
      summary: Obter perfil público de um Usuário ou ONG
      tags:
        - Usuários & Autenticação
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID único do Usuário ou ONG (UUID)
      responses:
        '200':
          description: Dados do perfil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '404':
          description: Usuário não encontrado.

  /api/users/logout:
    post:
      summary: Encerrar sessão (Logout)
      tags:
        - Usuários & Autenticação
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logout realizado com sucesso (Sem conteúdo).
        '400':
          description: Erro ao realizar logout.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/ongs/{id}/support:
    post:
      summary: Apoiar/Seguir uma ONG
      tags:
        - Apoio a ONGs
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID da ONG a ser apoiada
      responses:
        '200':
          description: Apoio registrado com sucesso.
          content:
            application/json:
              example:
                message: "Apoio registrado com sucesso!"
                result:
                  userId: "uuid-user-123"
                  ongId: "uuid-ong-456"
        '400':
          description: Não foi possível apoiar esta ONG.
        '401':
          $ref: '#/components/responses/Unauthorized'

    delete:
      summary: Deixar de apoiar/seguir uma ONG
      tags:
        - Apoio a ONGs
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
          description: ID da ONG a remover o apoio
      responses:
        '200':
          description: Apoio removido.
          content:
            application/json:
              example:
                message: "Apoio removido."
                result: true
        '400':
          description: Erro ao remover apoio.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users/me:
    put:
      summary: Atualizar dados do perfil do usuário autenticado
      tags:
        - Usuários & Autenticação
      security:
        - bearerAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: "Maria Silva Santos"
                email:
                  type: string
                  format: email
                  example: "maria.santos@email.com"
                description:
                  type: string
                  example: "Nova descrição do perfil."
                pixKey:
                  type: string
                  example: "maria.santos@email.com"
                profilePicture:
                  type: string
                  format: binary
                  description: Nova foto de perfil (Opcional)
      responses:
        '200':
          description: Perfil atualizado com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Erro ao atualizar o perfil.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ==========================================
  # CAUSES
  # ==========================================
  /api/causes:
    get:
      summary: Listar todas as causas cadastradas
      tags:
        - Causas
      responses:
        '200':
          description: Lista de causas sociais retornada com sucesso.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Cause'
        '500':
          description: Erro interno no servidor.

    post:
      summary: Cadastrar uma nova causa social
      tags:
        - Causas
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CauseInput'
      responses:
        '201':
          description: Causa cadastrada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cause'
        '400':
          description: Nome duplicado ou dados inválidos.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/causes/{id}:
    get:
      summary: Obter detalhes de uma causa por ID
      tags:
        - Causas
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Detalhes da causa encontrados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CauseDetail'
        '404':
          description: Causa não encontrada.

    put:
      summary: Atualizar uma causa existente
      tags:
        - Causas
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CauseInput'
      responses:
        '200':
          description: Causa atualizada com sucesso.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cause'
        '400':
          description: Nome em uso ou erro na requisição.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Causa não encontrada.

    delete:
      summary: Remover uma causa social
      tags:
        - Causas
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PathId'
      responses:
        '200':
          description: Causa removida com sucesso.
          content:
            application/json:
              example:
                message: "Causa removida com sucesso."
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Causa não encontrada.

# ==========================================
# COMPONENTES E SCHEMAS
# ==========================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PathId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: ID único do recurso (UUID)

  responses:
    Unauthorized:
      description: Token Ausente ou Inválido / Sem permissão de ONG.
      content:
        application/json:
          example:
            error: "Acesso não autorizado."
    NotFound:
      description: Recurso não encontrado.
      content:
        application/json:
          example:
            error: "Recurso não encontrado."

  schemas:
    UserProfile:
      type: object
      properties:
        id:
          type: string
          example: "uuid-123-abc"
        name:
          type: string
          example: "Maria Silva"
        email:
          type: string
          example: "maria@email.com"
        type:
          type: string
          enum: ["U", "O"]
          example: "U"
        profilePicture:
          type: string
          nullable: true
          example: "https://res.cloudinary.com/demo/image/upload/v1234567/profile.jpg"
        description:
          type: string
          nullable: true
          example: "Voluntária e doadora."
        pixKey:
          type: string
          nullable: true
          example: "maria@email.com"
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T10:00:00.000Z"
    DonationInput:
      type: object
      required:
        - itemName
        - category
        - quantity
        - unit
        - type
        - donorId
      properties:
        itemName:
          type: string
          example: "Arroz Integral"
        category:
          type: string
          example: "Alimentos"
        quantity:
          type: number
          example: 15
        unit:
          type: string
          example: "KG"
        type:
          type: string
          enum: [CREDIT, DEBIT, MONEY, PIX]
          example: "PIX"
        donorId:
          type: string
          example: "uuid-do-usuario-doador"
        projectId:
          type: string
          example: "uuid-do-projeto-opcional"

    Donation:
      type: object
      properties:
        id:
          type: string
        donor:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
        goal:
          type: object
          nullable: true
          properties:
            id:
              type: string
            title:
              type: string
        contributionType:
          type: string
        itemName:
          type: string
        quantity:
          type: number
        status:
          type: string
          enum: [PENDING, CHECKED_IN, CANCELLED]
        createdAt:
          type: string
          format: date-time

    ProjectInput:
      type: object
      required:
        - title
        - description
      properties:
        title:
          type: string
          example: "Reforma da Cozinha Comunitária"
        description:
          type: string
          example: "Arrecadação de materiais de construção para reforma"
        causeIds:
          type: array
          items:
            type: string
          example: ["uuid-causa-1", "uuid-causa-2"]

    InventoryInput:
      type: object
      required:
        - itemName
        - category
        - unit
        - quantity
      properties:
        itemName:
          type: string
          example: "Feijão Preto"
        category:
          type: string
          example: "Alimentos"
        unit:
          type: string
          example: "KG"
        quantity:
          type: number
          example: 50.5
        minimumQuantity:
          type: number
          example: 10
    
    CauseInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          example: "Proteção Animal"
        description:
          type: string
          example: "Causas voltadas ao resgate, tratamento e adoção de animais."

    Cause:
      type: object
      properties:
        id:
          type: string
          example: "uuid-cause-123"
        name:
          type: string
          example: "Proteção Animal"
        description:
          type: string
          nullable: true
          example: "Causas voltadas ao resgate, tratamento e adoção de animais."
        createdAt:
          type: string
          format: date-time
          example: "2026-09-01T12:00:00.000Z"
        _count:
          type: object
          properties:
            interestedUsers:
              type: integer
              example: 15
            projects:
              type: integer
              example: 3

    CauseDetail:
      allOf:
        - $ref: '#/components/schemas/Cause'
        - type: object
          properties:
            projects:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                  title:
                    type: string
                  description:
                    type: string
                  ong:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string